name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, finish-mvp]
    paths:
      - "LevelUp/**"
      - "shared/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: LevelUp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LevelUp/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64)
        working-directory: LevelUp/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Elysia-apk
          path: LevelUp/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
